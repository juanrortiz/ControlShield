<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"> <html>
<html>
	<head>
		<title>Variable Browser</title>
		<meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;"/>
		<link rel="stylesheet" type="text/css" href="myModal.css" />
		<link rel="stylesheet" type="text/css" href="flexigrid.css">
		<script type="text/javascript" src="jquery-1.3.2.min.js"></script>
		<script type="text/javascript" src="flexigrid.js"></script>
		<script type="text/javascript" src="jqModal.js"></script>
		<script type="text/javascript" src="jquery.timers.js"></script>
		<style>	
			.flexigrid div.fbutton .stop {
				background: url(images/stop.png) no-repeat center center;
			}
			.flexigrid div.fbutton .stop.refresh {
				background: url(images/load.png) no-repeat center center;
			}
			.flexigrid div.pDiv .pcontrol input {
				width: 30px;
			}
			#listbox {width: 100px;}
			#listSelector {width: 100px;}
			#newListName {width: 80px;}
			#newValue, #varName {width: 195px;}
			#newValue {margin-top: 2px;}
			#varName {background-color: #ddd;border: 1px solid #ccc;}
			#baseSelectorDiv {margin-top: 4px;}
			.locked {background: url(images/lock.gif) no-repeat top right;}
			.badquality {background: url(images/badquality.gif) no-repeat top right;}
			.colAdd {background: url(images/add.png) no-repeat center center;}
			.colAddDisabled {background: url(images/addgr.png) no-repeat center center;}
			.colDel {background: url(images/delete.png) no-repeat center center;}
			.delList {background: url(images/delete.png) no-repeat left center;}
			.colDelDisabled {background: url(images/deletegr.png) no-repeat center center;}
			.checkable {background: url(images/uncheck.png) no-repeat center center;}
			.checkable.checked {background: url(images/checkbox.png) no-repeat center center;}
		</style>

		<script type="text/javascript">
			function getLanguageParam(strParamName){
				var language = "en";
				var href = window.location.href;
				if (href.indexOf("?") > -1) {
					var params = href.substr(href.indexOf("?") + 1).toLowerCase().split('=');
					if (params[0] == "language") 
						return params[1];
				}
				return language;
			}
			
			function loadLanguagePack(){
				var language = getLanguageParam();
				var cmd = '<script language="javascript" src="strings.js?language=' + language + '" type="text/javascript"><\/script>';
				document.write(cmd);
			}

			loadLanguagePack();
		</script>
		
		<script type="text/javascript">
			var databases = [];
			var lists = [];
			var bases = [];
			var access = [];
			var varData = [];
			var databasesLoaded = false;
			var listsLoaded = false;
			
			var refreshing = false;
			var requestPending = false;
			var refreshGood = 1000;
			var refreshError = 10000;
			var currentRefresh = refreshGood;
			var database = '';
			var errorState = false;
			var paused = false;
			var listBoxText = '';
			var editMode = false;
			
			var changeVarId = 0;
			var stopPressed = false;
			var viewingList = false;
			
			var tableWidth = 400;
			var nameWidth = 259;
			var valueWidth = 115;
			
			if (screen.width <= 480) {
				tableWidth = 304;
				nameWidth = 198;
				valueWidth = 80;
			}
			
			if (document.images)
			{
				img1 = new Image();
				img1.src = "images/badquality.gif";
				img2 = new Image();
				img2.src = "images/add.png";
				img3 = new Image();
				img3.src = "images/delete.png";
				img4 = new Image();
				img4.src = "images/uncheck.png";
				img5 = new Image();
				img5.src = "images/checkbox.png";
			}

			function setValueClass(cellDiv, pid) {
				$(cellDiv).addClass("colValue");
			}
			
			function changeVariable(item) {
				paused = true;
				var varName = item.find("td:nth-child(2)").text();
				var curValue = item.find("td:nth-child(3)").text();
				
				changeVarId = item[0].id.substr(3);
				
				$('#varName').val(varName);
				$('#newValue').val(curValue);
				
				$('#changeValue').jqmShow();
				
				var access = getVarAccess(changeVarId);
				
				var badq = item.find("td:nth-child(3) div").hasClass("badquality");
				
				if ((access == 'r') || (badq == true)) {
					if (access == 'r')
						$('#newValue').addClass("locked");
					else
						$('#newValue').addClass("badquality");
					$('#newValue').attr("readonly", true);
					$('#change_var').attr("disabled", true);
					$('#cancel_change').focus();
				} else {
					$('#newValue').removeClass("locked");
					$('#newValue').removeClass("badquality");
					$('#newValue').attr("readonly", false);
					$('#change_var').attr("disabled", false);
					$('#newValue').focus();
					var input = $('#newValue').get(0);
					if (input.setSelectionRange) {
						input.setSelectionRange(0, curValue.length);
					} else if (input.createTextRange){
						var range = input.createTextRange();
						range.collapse(true);
						range.moveEnd('character', curValue.length);
						range.moveStart('character', 0);
						range.select();
					}
				}
			}
			
			function sendChangeValueRequest() {
				var newValue = $('#newValue').val();
				if (getVarType(changeVarId) == 'i') {
					var base = 10;
					if (newValue.length > 1) {
						if ((newValue.charAt(0) == '0') && (newValue.charAt(1) == 'x')) {
							base = 16;
							newValue = newValue.substr(2);
						}
					}
					
					$.ajax({
						url:"../services/variable/" + database + '/' + changeVarId,
						type:'POST',
						data:{action:'change',newVal:newValue,base:base},
						success: function(data, textStatus) {
							$('#changeValue').jqmHide();
							paused = false;
						},
						error: function (XMLHttpRequest, textStatus, errorThrown) {
							alert(lang.varOutOfRange);
						}
					});
				} else {
					$.ajax({
						url:"../services/variable/" + database + '/' + changeVarId,
						type:'POST',
						data:{action:'change',newVal:newValue},
						success: function(data, textStatus) {
							$('#changeValue').jqmHide();
							paused = false;
						},
						error: function (XMLHttpRequest, textStatus, errorThrown) {
							alert(lang.varOutOfRange);
						}
					});
				}
			}
			
			function getVarType(varId){
				for (var i = 1; i < varData.length; i++) {
					if (varId == varData[i][2])
						return varData[i][1];
				}
				return '';
			}
			
			function getVarAccess(varId){
				for (var i = 1; i < varData.length; i++) {
					if (varId == varData[i][2])
						return varData[i][3];
				}
				return '';
			}
			
			function setEditClass(cellDiv, pid) {
				$(cellDiv).addClass("checkable");
				$(cellDiv).click(
					function ()	{
						handleCheckBoxClick($(this));
					}
				);
			}
			
			function handleCheckBoxClick(item){
				item.toggleClass("checked");
				var numChecked = $('.checked').length;
				if (numChecked == 0) {
					if (viewingList) {
						$("[axis='col0']").addClass("colDelDisabled");
					} else {
						$("[axis='col0']").addClass("colAddDisabled");
					}
				} else {
					if (viewingList) {
						$("[axis='col0']").removeClass("colDelDisabled");
						$("[axis='col0']").addClass("colDel");
					} else {
						$("[axis='col0']").removeClass("colAddDisabled");
						$("[axis='col0']").addClass("colAdd");
					}
				}
			}
			
			function handleEditButtonClick() {
				if ($("[axis='col0']").hasClass("colDelDisabled")) {
					return;
				}
				if ($("[axis='col0']").hasClass("colAddDisabled")) {
					return;
				}
				paused = true;
				if (viewingList) {
					deleteVarsFromList();
				} else {
					populateAddListCombo();
					$('#newListName').val('');
					$('#addToListDialog').jqmShow();
				}
			}
			
			function deleteVarsFromList(pid) {
				var idList = getSelectedIds();
				if (confirm(lang.deleteSelected)) {
					$.post(
						"../services/varLists/" + listBoxText,
						{action:'deletevars',ids:idList},
						function(data) {
							paused = false;
							$("#flex1").flexReload();
						}
					);
				} else {
					paused = false;
				}
			}

			var parameters = {
				method: 'GET',
				dataType: 'json',
				colModel : [
					{display: '', name:'edit', width : 16, sortable : false, align: 'left', hide:true, process:setEditClass},
					{display: lang.name, name:'name', width : nameWidth, sortable : false, align: 'left'},
					{display: lang.value, name:'value', width : valueWidth, sortable : false, align: 'left', process:setValueClass}
				],
				buttons : [
					{listbox: true, id: 'listbox'},
					{separator: true},
					{name: '\u00A0', bclass: 'stop', onpress : onStop},
					{separator: true},
					{name: lang.editMode, aclass: 'editList', onpress : toggleEditColumn},
					{separator: true, aclass:'editList'},
					{name: lang.deleteList, bclass: 'delList', hide:true, onpress : onDeleteList},
					{separator: true, hide:true, aclass:'delList'}
				],
				singleSelect: true,
				title: lang.title,
				namefiltermsg: lang.nameFilter,
				useRp:true,
				rp: 13,
				rpOptions: [10,13,15,20],
				width: tableWidth,
				height: 'auto',
				autoload: false,
				usepager: true,
				searchitems: [{display: lang.name, name:'name', isdefault:true}],
				onSuccess: function() {
					window.scrollTo(0, 1);
					
					if ((!refreshing) && (!stopPressed))
					{
						$('.stop').removeClass('refresh');
						refreshing = true;
						readListData();
						$('#mainBody').everyTime(currentRefresh, 'controlled', function() {
							readListData();
						});
					}
					
					$(".colValue").parent().click(
						function ()	{changeVariable($(this).parents('tr'));}
					);
					
					$(".colValue").each(function(index) {
						if (access[index] == 'r')
							$(this).addClass("locked");
					});
				},
				preProcess: function(data) {
					varData = data;
					var newData = {};
					var r = [];
					bases = [];
					access = [];
					if (data.length == 0) {
						newData = {total:0};
					} else {
						var total = data[0].total;
						for (var i = 1; i < data.length; i++) {
							r[i-1] = {id:data[i][2], cell:['', data[i][0], '-']};
							access[i-1] = data[i][3];
							if (data[i][4]) {
								bases[i-1] = data[i][4];
							} else {
								bases[i-1] = -1;
							}
						}
						newData = {total:total, rows:r};
					}
					return newData; 
				}
			};

			$(function() {
				if(jQuery.browser.msie && parseInt(jQuery.browser.version, 10) == 6) {
					try {
						document.execCommand("BackgroundImageCache", false, true);
					} catch(err) {}
				}

				$('#connectionGoneDialog').jqm({modal: true});
				$('#addToListDialog').jqm({modal: true});
				$('#changeValue').jqm({modal: true});
				
				$("#flex1").flexigrid(parameters);
				
				$('#listbox').change(function () {
					database = $('#listbox').val();
					if (isNaN(database)) {
						viewingList = false;
						$('.pSearch').show();
						$('#flex1').flexOptions({newp:1, url:'../services/variable/' + database}).flexReload();
					}
					else {
						viewingList = true;
						$('#flex1').flexResetQuery();
						$('.sDiv').hide();
						$('.pSearch').hide();
						var id = parseInt(database);
						database = lists[id][1]
						listBoxText = $('#listbox option:selected').text();
						$('#flex1').flexOptions({newp:1, url:'../services/varLists/' + listBoxText}).flexReload();
					}
					if (viewingList) {
						$("[axis='col0']").removeClass("colAdd");
						$("[axis='col0']").removeClass("colAddDisabled");
						$("[axis='col0']").addClass("colDelDisabled");
					}
					else {
						$("[axis='col0']").removeClass("colDel");
						$("[axis='col0']").removeClass("colDelDisabled");
						$("[axis='col0']").addClass("colAddDisabled");
					}
					$("[axis='col0']").click(handleEditButtonClick);
					if (editMode) {
						if (viewingList)
							$('.delList').show();
						else
							$('.delList').hide();
					}
				});
				
				$('#listSelector').change(function () {
					var listOption = $('#listSelector').val();
					if (listOption == 'new'){
						$('#newListName').show();
					}
					else {
						$('#newListName').hide();
					}
				});
				
				$('#cancel_add').click(function() {
					paused = false;
				});
				
				$('#cancel_change').click(function() {
					paused = false;
				});
				
				$('#change_var').click(function() {
					sendChangeValueRequest();
				});
				
				$('#newValue').keydown(function(e){if((e.keyCode==13)||(e.keyCode==10)) $('#change_var').click()});
				$('#varName').keydown(function(e){
					if((e.keyCode>=35)&&(e.keyCode<=40)) 
						return true;
					return false;
				});
				
				$('#add_new_var').click(function() {
					var listOption = $('#listSelector').val();
					if (listOption == 'new'){
						var listName = $('#newListName').val();
						
						$.ajax({
							url: "../services/varLists/" + listName,
							type: 'POST',
							data: {action:'add', db:database}, 
							success: function(data, textStatus) {
								$('#addToListDialog').jqmHide();
								addSelectedVarsToList(listName);
								getLists();
								paused = false;
							},
							error: function(XMLHttpRequest, textStatus, errorThrown) {
							    if (XMLHttpRequest.status == 409) {
								    alert(lang.listAlreadyExists);
								} else {
								    alert(lang.maxNumberOfLists);
								}
							}
						});
					}
					else {
						$('#addToListDialog').jqmHide();
						var listName = $('#listSelector option:selected').text();
						addSelectedVarsToList(listName);
						paused = false;
					}
				});
				
				$.getJSON(
					"../services/variable", 
					function(data) {
						databases = data;
						databasesLoaded = true;
						getLists();
					}
				);
				
				$("#connectionGoneDialog div").append(lang.connectionLost);
				$("#addToListDialog .dialogTitle").append(lang.addVarTitle);
				$("#add_new_var").val(lang.add);
				$("#cancel_add").val(lang.cancel);
				
				$("#changeValue .dialogTitle").append(lang.changeVarTitle);
				$("#cancel_change").val(lang.cancel);
				$("#change_var").val(lang.write);
				
				$("#baseSelectorDiv label").text(lang.viewAs);
			});
			
			function populateMainCombo() {
				var dbSelect = $('#listbox').get(0);
				
				while (dbSelect.length > 0) {
					dbSelect.remove(0);
				}
				
				var i = 0;
				for (i = 0; i < databases.length; i++) {
					var opt = new Option(databases[i], databases[i]);
      				dbSelect.options[i] = opt;
				}
				
				if (lists.length > 0) {
					var separatorOpt = new Option("-----------------", "-");
	      			dbSelect.options[i] = separatorOpt;
	      			i++;
	  			}
				
				for (var j = 0; j < lists.length; j++, i++) {
					var opt = new Option(lists[j][0], j);
					dbSelect.options[i] = opt;
				}
				if ($('#listbox').val() == databases[0]) {
					$('#listbox').change();
				} else {
					$('#listbox').val(databases[0]);
				}
				paused = false;
			}
			
			function populateAddListCombo() {
				var listSelect = $('#listSelector').get(0);
				
				while (listSelect.length > 0) {
					listSelect.remove(0);
				}
				
                var pos = 0;
                for (var i = 0; i < lists.length; i++) {
                	if (lists[i][1] == database) {
	                	var opt = new Option(lists[i][0], lists[i][0]);
	      				listSelect.options[pos] = opt;
	      				pos++;
	  				}
            	}
            	var opt = new Option(lang.newList, "new");
				listSelect.options[pos] = opt;	
				$('#listSelector').change();
			}
			
			function getLists() {
				$.getJSON(
                   "../services/varLists", 
                   function(data) {
                   		var listaccess = data[0].access;
                   		if (listaccess == 'r') {
                   			$('.editList').hide();
                   		}
						lists = data.slice(1);
						listsLoaded = true;
						populateMainCombo();
                    }
               );
			}
			
			function getSelectedIds() {
				var idList = ""
				var first = true;
				$('tr:has(.checked)').each(
					function(intIndex, obj){
						var varId = obj.id.substr(3);
						if (first) {
							first = false;
						} else {
							idList += ';';
						}
						idList += varId;
					}
				);
				return idList;
			}
			
			function addSelectedVarsToList(name) {
				var idList = getSelectedIds();
				
				$('.checked').removeClass('checked');
				var b = $('#baseSelector').val();
				
				$.ajax({
					url:"../services/varLists/" + name,
					type:'POST',
					data: {action:'addvars',ids:idList,base:b},
					error: function(XMLHttpRequest, textStatus, errorThrown) {
						alert(lang.maxVarsInList);
					}
				});
			}
			
			function toggleEditColumn(com, grid) {
				if (editMode) {
					editMode = false;
					$('.delList').hide();
					$('th:visible div:eq(1)').css('width',nameWidth);
					$('tr').each (
						function ()	{
							$('td:visible div:eq(1)',this).css('width',nameWidth);
						}
					);
				}
				else {
					editMode = true;
					if (viewingList)
						$('.delList').show();
					$('th:visible div:eq(0)').css('width',nameWidth - 28);
					$('tr').each (
						function ()	{
							$('td:visible div:eq(0)',this).css('width',nameWidth - 28);
						}
					);
				}
				$('#flex1').flexToggleCol(0);	
			}
			
			function onDeleteList(com, grid) {
				paused = true;
				if (confirm(lang.deleteSelectedList)) {
					$.post(
						"../services/varLists/" + listBoxText,
						{action:'delete'},
						function(data) {
							getLists();
						}
					);
				} else {
					paused = false;
				}
			}

			function onStop(com, grid) {
				if (refreshing) {
					stopPressed = true;
					$('#mainBody').stopTime('controlled');
					refreshing = false;
					$('.stop').addClass('refresh');
				} else {
					stopPressed = false;
					refreshing = true;
					$('.stop').removeClass('refresh');
					readListData();
					$('#mainBody').everyTime(currentRefresh, 'controlled', function() {
						readListData();
					});
				}
			}
			
			function readListData() {
				if (paused)
					return;
				if ((!databasesLoaded) || (!listsLoaded))
					return;
				var pageInput = $('.pGroup input[type=text]').val();
				if (!requestPending) {
					requestPending = true;
					var rp = $('.pGroup select').val();
					
					var url;
					if (viewingList) {
						url = "../services/varLists/" + listBoxText + "/values?page=" + pageInput + "&rp=" + rp;
					} else {
						url = "../services/variable/" + database + "/values?page=" + pageInput + "&rp=" + rp;
						var filterInput = $('#flex1').flexGetQuery();
						if (filterInput)
							url += "&filter=" + filterInput;
					}
					
					$.ajax({
						url: url,
						type: 'GET',
						dataType: 'json',
						timeout: 15000,
						success: function(data) {
							if (refreshing && (currentRefresh != refreshGood))
							{
								currentRefresh = refreshGood;
								$('#mainBody').stopTime('controlled');
								$('#mainBody').everyTime(currentRefresh, 'controlled', function() {
									readListData();
								});
							}
					
							requestPending = false;
							if (errorState) {
								errorState = false;
								$('#connectionGoneDialog').jqmHide();
							}
							var i = 0;
							$('.colValue').each(function () {
								var pre = '';
								var post = '';
								if (bases[i] == 16)
									pre = '0x';
								else if (bases[i] == 8) {
									if (data[i][0] != '0')
										pre = '0';
								}
								else if (bases[i] == 2)
									post = 'b';
										
								var quality = data[i][1];
								if (quality == 0) {
									$(this).removeClass('badquality');
									if (data[i][0] === '')
										$(this).text('\u00A0');
									else
										$(this).text(pre + data[i][0] + post);
								}
								else if (quality == 1) {
									$(this).text('-');
								}
								else {
									$(this).addClass('badquality');
									if (data[i][0] === '') {
										$(this).text('\u00A0');
									} else {
										$(this).text(pre + data[i][0] + post);
									}
								}
								i = i + 1;
							});
						},
						error: function() {
							requestPending = false;
							if (refreshing) {
								errorState = true;
								$('#connectionGoneDialog').jqmShow();
								$('#mainBody').stopTime('controlled');
								currentRefresh = refreshError;
								$('#mainBody').everyTime(currentRefresh, 'controlled', function() {
									readListData();
								});
							}	
						}
					});
				}
			}
		</script>
	
	</head>
	
	<body id='mainBody'>
		<div class="jqmWindow" id="connectionGoneDialog">
        	<div align='center'><img src="images/badquality.gif" alt="error" />&nbsp;</div>
        </div>
        
		<div class="jqmWindow" id="addToListDialog">
			<div class="dialogTitle"></div>
			<hr />
			<div>
				<select id="listSelector"></select>
				<input type="text" id="newListName" name="newListName">
			</div>
			<div id='baseSelectorDiv'>
				<label for="baseSelector"></label>
				<select id="baseSelector">
					<option value='10'>Dec</option>
					<option value='16'>Hex</option>
				</select>
			</div>
			<hr />
